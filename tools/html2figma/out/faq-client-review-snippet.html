<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1440">
  <title>Vertical Software — FAQ capture</title>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
:root {
  --brand: #00587C;
  --gold: #FFC600;
  --paper: #FFFFFF;
  --ink: #0C1B21;
  --muted: #586A72;
  --line: #DCE3E6;
  --sans: "Instrument Sans", system-ui, sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --mono: "Fragment Mono", ui-monospace, monospace;
  --wrap: 1280px;
  --gutter: 64px;
  --bar: 76px;
  --sect: 120px;
  --t-h2: 76px;
  --e: cubic-bezier(.22, .75, .24, 1);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 17px; }
.wrap { width: min(var(--wrap), 100% - (2 * var(--gutter))); margin-inline: auto; }
.display { font-weight: 500; line-height: .96; letter-spacing: -.035em; }
.display em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -.015em; }
#faq-title em { color: var(--gold); letter-spacing: 0; display: block; }
.display--l { font-size: var(--t-h2); }
.faq { padding-block: var(--sect); background: var(--paper); width: 1440px; }
.faq__grid {
  display: grid;
  grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
  gap: 80px;
  align-items: start;
}
.faq__head { max-width: 250px; }
.faq__title { line-height: 0.945; letter-spacing: -0.035em; }
.faq__title-sans { display: block; }
.faq__list { border-top: 1px solid var(--ink); }
.faq__item { border-bottom: 1px solid var(--line); }
.faq__item summary {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 26px;
  gap: 20px;
  align-items: start;
  padding: 23.5px 0 23.89px;
  cursor: pointer;
  list-style: none;
  font-size: 1.25rem;
  font-weight: 500;
  letter-spacing: -0.012em;
  line-height: 1.32;
}
.faq__item summary::-webkit-details-marker { display: none; }
.faq__item summary::after {
  content: "+";
  font-family: var(--mono);
  font-size: 1.125rem;
  line-height: 1;
  color: var(--muted);
  justify-self: end;
}
.faq__item[open] summary::after { content: "−"; color: var(--ink); }
  </style>
</head>
<body>
  <section class="faq" id="faq">
    <div class="wrap faq__grid">
      <div class="faq__head">
        <h2 class="display display--l faq__title" id="faq-title"><span class="faq__title-sans">Common<br>questions,</span> <em>answered.</em></h2>
      </div>
      <div class="faq__list">
        <details class="faq__item" open><summary>Do you buy software companies, or add services to them?</summary></details>
        <details class="faq__item"><summary>Do you change the brand or the team?</summary></details>
        <details class="faq__item"><summary>Is AI part of this strategy?</summary></details>
      </div>
    </div>
  </section>
</body>
</html>
