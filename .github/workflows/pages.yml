name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # Build the site into an explicit allowlist instead of publishing the repo
      # root. `path: "."` served every tracked file, which put PROJECT_KNOWLEDGE_BASE.md
      # (client strategy + the V2 figures that are NOT cleared for publication, see
      # PROJECT_KNOWLEDGE_BASE.md 22 / 20.7) and the plans/ and 01_Discovery/ notes on
      # the public web. Staging the allowlist by hand means a future `git add` of
      # confidential material cannot leak by default - it has to be added here on purpose.
      - name: Stage the published site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp 404.html _site/
          cp -R 02_Wireframes _site/
          # Internal preview — HTML + logo + royalty-free hero-stock.mp4.
          # Square reference media (hero-video.*, hero-poster.jpg, hero-bg.png)
          # stays gitignored / local — never stage those.
          mkdir -p _site/03_Design/explorations/02-video-hero/assets
          cp 03_Design/explorations/02-video-hero/index.html \
             _site/03_Design/explorations/02-video-hero/
          cp 03_Design/explorations/02-video-hero/assets/fullsteam-logo.svg \
             03_Design/explorations/02-video-hero/assets/hero-stock.mp4 \
             _site/03_Design/explorations/02-video-hero/assets/
          # homev2 — load-time hero entrance + sticky rail (shares hero assets with 02)
          mkdir -p _site/03_Design/explorations/homev2/assets
          cp 03_Design/explorations/homev2/index.html \
             _site/03_Design/explorations/homev2/
          cp 03_Design/explorations/02-video-hero/assets/fullsteam-logo.svg \
             03_Design/explorations/02-video-hero/assets/hero-stock.mp4 \
             _site/03_Design/explorations/homev2/assets/
          # client-review — the OFFICIAL homepage linked from the review portal
          # (sizzle-video opening → copy-swap Axis B, Acquire/Grow/Lead process
          # band, verticals accordion, AI, founders, way-finder), plus the
          # interior pages: Vertical Software, Our Advantage, Our Story, Careers, Acquisitions.
          # HTML + logos + hero fallback + local section photography (2026-11-02
          # ledger build). design-notes.md and linkedin-slots.md stay out of
          # _site on purpose. hero-sizzle.mp4 is gitignored and not staged.
          mkdir -p _site/03_Design/client-review/homepage/assets/img
          cp 03_Design/client-review/homepage/index.html \
             03_Design/client-review/homepage/vertical-software.html \
             03_Design/client-review/homepage/our-advantage.html \
             03_Design/client-review/homepage/our-story.html \
             03_Design/client-review/homepage/careers.html \
             03_Design/client-review/homepage/for-founders.html \
             03_Design/client-review/homepage/contact.html \
             _site/03_Design/client-review/homepage/
          cp 03_Design/client-review/homepage/assets/fullsteam-logo.svg \
             03_Design/client-review/homepage/assets/fullsteam-logo-dark.svg \
             03_Design/client-review/homepage/assets/hero-fallback.mp4 \
             _site/03_Design/client-review/homepage/assets/
          cp -R 03_Design/client-review/homepage/assets/img/. \
             _site/03_Design/client-review/homepage/assets/img/
          # Portfolio logos are NOT in the repo on purpose: they are third-party
          # marks pending clearance (KB 29.7 / OI-16) and .gitignore ignores
          # assets/* wholesale. A hosted runner therefore never has these files,
          # and an unguarded `cp` failed the entire deploy. Copy when the
          # directory is present (a local run, or after clearance + git add) and
          # publish without them otherwise - the vertical panels keep their text
          # placeholders, because the manifest fetch is already guarded in
          # vertical-software.html.
          LOGOS=03_Design/client-review/homepage/assets/logos
          mkdir -p _site/03_Design/client-review/homepage/assets/logos
          if [ -d "$LOGOS" ]; then
            cp -R "$LOGOS"/. _site/03_Design/client-review/homepage/assets/logos/
            echo "logos: staged $(find "$LOGOS" -type f | wc -l | tr -d ' ') files from $LOGOS"
          else
            echo "::notice title=Portfolio logos skipped::$LOGOS is not in the repo (gitignored, clearance pending) - the site ships without business-unit and partner logos"
          fi
          # The frozen A/B arm, linked from the portal. It references ../assets
          # (the logos above) and the wireframe pages, both staged, so it opens
          # standalone from this path.
          mkdir -p _site/03_Design/client-review/homepage/variants
          cp 03_Design/client-review/homepage/variants/hero-A-paper-mesh-2026-10-29.html \
             _site/03_Design/client-review/homepage/variants/
          echo "--- published ---"
          find _site -type f | sort
          echo "--- confirm nothing internal leaked in ---"
          if find _site -type f \
               \( -name '*.md' -o -path '*plans*' -o -path '*01_Discovery*' \
                  -o -path '*clientDocs*' -o -name '.git*' \
                  -o -name 'hero-video.*' -o -name 'hero-poster.jpg' \
                  -o -name 'hero-bg.png' \) | grep -q .; then
            echo "::error::internal file staged for publication - check the allowlist"
            exit 1
          fi
          echo "ok: no internal files staged"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
